<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit post</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/index.js" type="module"></script>
  </head>
  <body
    class="flex flex-col items-center min-h-screen bg-gray-100 overflow-x-hidden"
  >
    <header
      class="bg-gradient-to-r from-green-100 to-blue-100 shadow-lg w-full overflow-x-hidden"
    >
      <nav class="container mx-auto flex justify-between items-center p-4">
        <a
          href="/"
          class="flex items-center text-3xl font-bold italic text-black"
        >
          <img class="w-10 h-10 mr-2" src="../assets/images/2.png" alt="Logo" />
          ConnectSphere
        </a>
        <div class="hidden md:flex items-center space-x-1">
          <a
            href="../feed/index.html"
            class="active py-2 px-4 text-black hover:text-green-500"
            >Feed</a
          >
          <a
            href="../profile/index.html"
            class="py-2 px-4 text-black hover:text-green-500"
            >Profile</a
          >
        </div>
        <!-- In desktop navigation -->
<div class="hidden md:flex items-center space-x-3">
  <a href="#"
     class="logout-link py-4 px-2 font-medium text-gray-600 rounded hover:bg-green-500 hover:text-white transition duration-300">
    Sign Out
  </a>
</div>
        <div class="md:hidden">
          <button id="menu-btn" class="text-black focus:outline-none">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h16"
              ></path>
            </svg>
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden">
        <!-- In mobile menu -->
<ul class="flex flex-col items-center space-y-4 p-4">
  <li>
    <a href="#"
       class="logout-link block py-2 px-4 text-black hover:text-green-500">
      Log Out
    </a>
  </li>
          <li>
            <a
              href="../feed/index.html"
              class="active block py-2 px-4 text-gray-500 hover:text-black"
              >Feed</a
            >
          </li>
          <li>
            <a
              href="../profile/index.html"
              class="block py-2 px-4 text-gray-500 hover:text-black"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </header>
    <main class="container mx-auto p-4 max-w-4xl">
      <section class="w-full p-4 mb-8">
        <h1 class="text-2xl mb-4">Edit</h1>
        <div id="message"></div>
        <form id="edit-post-form" class="bg-white p-6 rounded shadow-md">
          <input type="hidden" id="id" name="id" />
          <div class="mb-4">
            <label for="title" class="block text-gray-700 font-bold mb-2"
              >Title</label
            >
            <input
              type="text"
              id="title"
              name="title"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div class="mb-4">
            <label for="content" class="block text-gray-700 font-bold mb-2"
              >Content</label
            >
            <textarea
              id="content"
              name="content"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              rows="4"
            ></textarea>
          </div>
          <div class="mb-4">
            <label for="imageUrl" class="block text-gray-700 font-bold mb-2"
              >Image url</label
            >
            <input
              type="text"
              id="imageUrl"
              name="imageUrl"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div class="mb-4">
            <label for="imageAlt" class="block text-gray-700 font-bold mb-2"
              >Image alt</label
            >
            <input
              type="text"
              id="imageAlt"
              name="imageAlt"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <button
            type="submit"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none transform hover:-translate-y-1 transition duration-200"
          >
            Update Post
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
