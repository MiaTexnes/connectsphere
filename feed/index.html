<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed | ConnectSphere</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/index.js" type="module"></script>
  </head>
  <body
    class="flex flex-col items-center justify-center min-h-screen bg-gray-100"
  >
    <header
      class="bg-gradient-to-r from-green-100 to-blue-100 shadow-lg w-full"
    >
      <nav class="container mx-auto flex justify-between items-center p-4">
        <a
          href="/"
          class="flex items-center text-3xl font-bold italic text-black"
        >
          <img class="w-10 h-10 mr-2" src="../assets/images/2.png" alt="Logo" />
          ConnectSphere
        </a>
        <div class="hidden md:flex items-center space-x-1">
          <a
            href="../feed/index.html"
            class="active py-2 px-4 text-black hover:text-green-500"
            >Feed</a
          >
          <a
            href="../profile/index.html"
            class="py-2 px-4 text-black hover:text-green-500"
            >Profile</a
          >
        </div>
        <div class="hidden md:flex items-center space-x-3">
          <a
            href="../index.html"
            class="py-4 px-2 font-medium text-gray-600 rounded hover:bg-green-500 hover:text-white transition duration-300"
            >Sign Out</a
          >
        </div>
        <div class="md:hidden">
          <button id="menu-btn" class="text-black focus:outline-none">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h16"
              ></path>
            </svg>
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden">
        <ul class="flex flex-col items-center space-y-4 p-4">
          <li>
            <a
              href="../index.html"
              class="block py-2 px-4 text-black hover:text-green-500"
              >Log Out</a
            >
          </li>
          <li>
            <a
              href="../feed/index.html"
              class="active block py-2 px-4 text-gray-500 hover:text-black"
              >Feed</a
            >
          </li>
          <li>
            <a
              href="../profile/index.html"
              class="block py-2 px-4 text-gray-500 hover:text-black"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </header>

    <main class="container mx-auto p-4 max-w-4xl">
      <section class="w-full p-4 mb-8">
        <h1 class="text-2xl mb-4">Create a New Post</h1>
        <div id="message"></div>
        <!-- Container for messages -->
        <form id="createPostForm" class="bg-white p-6 rounded shadow-md">
          <div id="message"></div>
          <div class="mb-4">
            <label for="title" class="block text-gray-700 font-bold mb-2"
              >Title</label
            >
            <input
              type="text"
              id="title"
              name="title"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div class="mb-4">
            <label for="content" class="block text-gray-700 font-bold mb-2"
              >Content</label
            >
            <textarea
              id="content"
              name="content"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              rows="4"
            ></textarea>
          </div>
          <button
            type="submit"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none"
          >
            Create Post
          </button>
        </form>
      </section>

      <section class="w-full p-4">
        <h2 class="text-2xl mb-4">Posts</h2>
        <div id="posts-container" class="posts-container"></div>
      </section>
    </main>
    <footer
      class="w-full text-center p-2 bg-gray-200 mt-auto bg-gradient-to-r from-green-100 to-blue-100 shadow-lg"
    >
      <p class="text-gray-700 py-2 text-center">
        &copy; 2024 ConnectSphere. All rights reserved.
      </p>
    </footer>
  </body>
</html>
