<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed | ConnectSphere</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/index.js" type="module"></script>
  </head>
  <body
    class="flex flex-col items-center min-h-screen bg-gray-100 overflow-x-hidden"
  >
    <header
      class="bg-gradient-to-r from-green-100 to-blue-100 shadow-lg w-full overflow-x-hidden"
    >
      <nav class="container mx-auto flex justify-between items-center p-4">
        <a
          href="/"
          class="flex items-center text-3xl font-bold italic text-black"
        >
          <img class="w-10 h-10 mr-2" src="../assets/images/2.png" alt="Logo" />
          ConnectSphere
        </a>
        <div class="hidden md:flex items-center space-x-1">
          <a
            href="../feed/index.html"
            class="active py-2 px-4 text-black hover:text-green-500"
            >Feed</a
          >
          <a
            href="../profile/index.html"
            class="py-2 px-4 text-black hover:text-green-500"
            >Profile</a
          >
        </div>
        <div class="hidden md:flex items-center space-x-3">
          <a
            href="../index.html"
            class="py-4 px-2 font-medium text-gray-600 rounded hover:bg-green-500 hover:text-white transition duration-300"
            >Sign Out</a
          >
        </div>
        <div class="md:hidden">
          <button id="menu-btn" class="text-black focus:outline-none">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h16"
              ></path>
            </svg>
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden">
        <ul class="flex flex-col items-center space-y-4 p-4">
          <li>
            <a
              href="../index.html"
              class="block py-2 px-4 text-black hover:text-green-500"
              >Log Out</a
            >
          </li>
          <li>
            <a
              href="../feed/index.html"
              class="active block py-2 px-4 text-gray-500 hover:text-black"
              >Feed</a
            >
          </li>
          <li>
            <a
              href="../profile/index.html"
              class="block py-2 px-4 text-gray-500 hover:text-black"
              >Profile</a
            >
          </li>
        </ul>
      </div>
    </header>

    <main class="container mx-auto p-4 max-w-4xl overflow-x-hidden">
      <section class="w-full p-4 mb-8">
        <h1 class="text-2xl mb-4">Create a New Post</h1>
        <div id="message"></div>
        <form id="createPostForm" class="bg-white p-6 rounded shadow-md">
          <div class="mb-4">
            <label for="title" class="block text-gray-700 font-bold mb-2"
              >Title</label
            >
            <input
              type="text"
              id="title"
              name="title"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div class="mb-4">
            <label for="content" class="block text-gray-700 font-bold mb-2"
              >Content</label
            >
            <textarea
              id="content"
              name="content"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              rows="4"
            ></textarea>
          </div>
          <div class="mb-4">
            <label for="imageUrl" class="block text-gray-700 font-bold mb-2"
              >Image url</label
            >
            <input
              type="text"
              id="imageUrl"
              name="imageUrl"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div class="mb-4">
            <label for="imageAlt" class="block text-gray-700 font-bold mb-2"
              >Image alt</label
            >
            <input
              type="text"
              id="imageAlt"
              name="imageAlt"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <button
            type="submit"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none transform hover:-translate-y-1 transition duration-200"
          >
            Create Post
          </button>
        </form>
      </section>

      <section class="w-full p-4">
        <h2 class="text-2xl mb-4">Posts</h2>
        <div class="flex justify-between mb-4">
          <div class="flex items-center space-x-4">
            <div class="flex">
              <input
                type="text"
                id="searchInput"
                placeholder="Search posts..."
                class="p-2 border rounded-l"
              />
              <button
                id="searchButton"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r focus:outline-none"
              >
                Search
              </button>
            </div>
            <select id="sortCriteria" class="p-2 border rounded">
              <option value="newToOld">New to Old</option>
              <option value="oldToNew">Old to New</option>
              <option value="aToÅ">A to Å</option>
            </select>
          </div>
        </div>
        <div
          id="posts-container"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 overflow-x-hidden"
        >
          <!-- Posts will be appended here -->
        </div>
      </section>
    </main>
    <footer
      class="w-full text-center p-2 bg-gray-200 mt-auto bg-gradient-to-r from-green-100 to-blue-100 shadow-lg"
    >
      <p class="text-gray-700 py-2 text-center">
        &copy; 2024 ConnectSphere. All rights reserved.
      </p>
    </footer>
    <div
      id="edit-post-modal"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden justify-center items-center z-50"
    >
      <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full mx-4">
        <h2 class="text-2xl font-bold mb-4">Edit Post</h2>
        <form id="edit-post-form" class="space-y-4">
          <div>
            <label class="block text-gray-700 font-bold mb-2" for="edit-title"
              >Title</label
            >
            <input
              type="text"
              id="edit-title"
              name="title"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>
          <div>
            <label class="block text-gray-700 font-bold mb-2" for="edit-body"
              >Content</label
            >
            <textarea
              id="edit-body"
              name="body"
              required
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              rows="4"
            ></textarea>
          </div>
          <div class="flex justify-end space-x-2">
            <button
              type="button"
              id="cancel-edit-btn"
              class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
