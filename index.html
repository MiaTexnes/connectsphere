<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Essential meta tags for character encoding and responsive viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | ConnectSphere</title>
    <!-- External resources -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/index.js" type="module"></script>
  </head>
  <!-- Body with responsive layout - column on mobile, row on medium screens and up -->
  <body
    class="flex flex-col md:flex-row items-center justify-center h-screen index-background"
  >
    <!-- Header section with branding - full width on mobile, half on desktop -->
    <header class="w-full md:w-1/2 text-left p-4">
      <h1 class="text-3xl md:text-6xl">ConnectSphere</h1>
      <p class="text-1xl md:text-2xl text-left p-4 italic">
        Shaping the Future of Social Interaction
      </p>
    </header>

    <!-- Main content area with login form -->
    <main class="w-full md:w-1/2 p-4">
      <section class="flex justify-center w-full p-4">
        <!-- Login form with validation -->
        <form
          id="loginForm"
          action="/profile"
          class="w-full max-w-lg mx-auto p-6 bg-white rounded shadow-md"
        >
          <!-- Dynamic message container for form feedback -->
          <div id="message"></div>

          <!-- Email input field -->
          <div class="mb-4">
            <label for="email" class="block text-gray-700 font-bold mb-2"
              >Email</label
            >
            <input
              type="text"
              name="email"
              id="email"
              required
              minlength="3"
              autocomplete="email"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
          </div>

          <!-- Password input field with validation -->
          <div class="mb-6">
            <label for="password" class="block text-gray-700 font-bold mb-2"
              >Password</label
            >
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="8"
              autocomplete="current-password"
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            />
            <!-- Hidden error message for password validation -->
            <p class="text-red-500 text-xs italic hidden" id="password-error">
              Please enter a password with at least 8 characters
            </p>
          </div>

          <!-- Form submission and registration redirect -->
          <div class="flex flex-col items-center justify-between">
            <!-- Submit button with hover effect -->
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 w-full rounded focus:outline-none mb-4"
            >
              Log in
            </button>

            <!-- Registration redirect for new users -->
            <div class="text-center mt-4 w-full">
              <p class="text-gray-600">
                Don't have an account?
                <a
                  href="register/index.html"
                  class="text-green-700 font-bold hover:text-green-500 underline transition-colors"
                >
                  Register here
                </a>
              </p>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
